<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta
      name="description"
      content="Dereth Network — a shared home and server registry for Asheron's Call. The public site is being built."
    />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="preload" href="/cinzel.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Dereth Network</title>
  </head>
  <body>
    <main class="shell">
      <div class="stage">
        <img class="vista" src="/vista.jpg" alt="" />
        <div class="wash wash-top"></div>
        <div class="wash wash-bottom"></div>
        <div class="curtain"></div>

        <div class="frame">
          <span class="ornament tl"></span>
          <span class="ornament tr"></span>
          <span class="ornament bl"></span>
          <span class="ornament br"></span>
        </div>

        <header class="lockup">
          <img class="star" src="/star.png" alt="" />
          <h1 class="wordmark"><span>Dereth</span><span>Network</span></h1>
        </header>

        <div class="plate-row">
          <p class="plate">Coming Soon</p>
        </div>

        <footer class="notice">
          <p>
            Asheron&rsquo;s Call and all related names, marks, and artwork are the property of their
            respective owners. This is an unaffiliated, non-commercial fan project.
          </p>
        </footer>
      </div>
    </main>
  </body>
</html>
