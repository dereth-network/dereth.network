<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0a10" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="An allegiance's characters on the Dereth Network." />

          <a href="https://play.dereth.network/?server=https://retail.dereth.network/status"

      <div id="absent"></div>

          ><a href="https://github.com/dereth-network/dereth">dereth-network/dereth</a> |
