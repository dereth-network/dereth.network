<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0a10" />
    <meta
      name="description"
      content="How Dereth's launcher finds, installs and updates art packs, and how to publish a source of your own."
    />
    <link rel="icon" href="/media/art/network-icon.png" type="image/png" />
    <script src="/realm.js"></script>
    <link rel="preload" href="/media/fonts/Cinzel-var.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/network.css" />
    <link rel="stylesheet" href="/src/guide.css" />
    <script type="module" src="/src/realm.ts"></script>
    <title>Art pack sources · Dereth Network</title>
  </head>
  <body>
    <div class="vista" aria-hidden="true">
      <img src="/media/art/obsidian-bridge.webp" alt="" data-realm-of="dereth" loading="lazy" />
      <img src="/media/art/tyrant.webp" alt="" data-realm-of="auberean" loading="lazy" />
    </div>

    <div class="page">
      <header class="top">
        <div class="brand">
          <a class="lockup" href="/" aria-label="Dereth Network">
            <img src="/media/art/network.webp" alt="" width="60" height="60" />
            <span class="word">DERETH<br />NETWORK</span>
          </a>
          <div class="realm" role="radiogroup" aria-label="Game">
            <button
              class="pick"
              type="button"
              role="radio"
              aria-checked="false"
              data-realm-pick="dereth"
              aria-label="Dereth, Asheron's Call"
            >
              <span class="portal" aria-hidden="true"
                ><img
                  class="vortex"
                  src="/media/portal/dereth-vortex.webp"
                  alt=""
                  width="52"
                  height="52" /><img
                  src="/media/portal/dereth-ring.webp"
                  alt=""
                  width="52"
                  height="52"
              /></span>
              Dereth<small>Asheron's Call</small>
            </button>
            <button
              class="pick"
              type="button"
              role="radio"
              aria-checked="false"
              data-realm-pick="auberean"
              aria-label="Auberean, Asheron's Call 2"
            >
              <span class="portal" aria-hidden="true"
                ><img
                  class="vortex"
                  src="/media/portal/auberean-vortex.webp"
                  alt=""
                  width="52"
                  height="52" /><img
                  src="/media/portal/auberean-ring.webp"
                  alt=""
                  width="52"
                  height="52"
              /></span>
              Auberean<small>Asheron's Call 2</small>
            </button>
          </div>
        </div>
        <nav class="rail" aria-label="Site">
          <a href="/network/">Network</a>
          <a href="https://github.com/dereth-network/dereth/releases/latest">Download</a>
          <a href="https://github.com/dereth-network/dereth">Source</a>
        </nav>
      </header>

      <!-- art-guide sources.md -->

      <footer class="foot">
        <span
          ><a href="https://github.com/dereth-network/dereth">dereth-network/dereth</a> |
          <a href="/report/">Report a world</a></span
        >
        <span
          >Dereth Network and all of its projects are independent, not affiliated with or endorsed
          by any current rights holder.</span
        >
      </footer>
    </div>
  </body>
</html>
